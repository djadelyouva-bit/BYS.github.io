    <div class="auth-container">
    <div class="auth-card">
        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login">Se connecter</button>
            <button class="tab-btn" data-tab="register">S'inscrire</button>
        </div>

        <!-- Formulaire Connexion -->
        <div class="auth-form active" id="login-form">
            <form id="loginForm">
                <div class="input-group">
                    <label>Email ou nom d'utilisateur</label>
                    <input type="email" id="loginEmail" placeholder="exemple@email.com" required>
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="●●●●●●●●" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Se souvenir de moi</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn-auth">Se connecter</button>
            </form>
            <div class="auth-separator">
                <span>Ou continuer avec</span>
            </div>
            <div class="social-login">
                <div class="social-btn">G</div>
                <div class="social-btn">f</div>
                <div class="social-btn">•</div>
            </div>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- Formulaire Inscription -->
        <div class="auth-form" id="register-form">
            <form id="registerForm">
                <div class="input-group">
                    <label>Nom complet</label>
                    <input type="text" id="regName" placeholder="Jean Dupont" required>
                </div>
                <div class="input-group">
                    <label>Adresse email</label>
                    <input type="email" id="regEmail" placeholder="exemple@email.com" required>
                </div>
                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="regPassword" placeholder="●●●●●●●●" required>
                </div>
                <div class="input-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="regConfirmPassword" placeholder="●●●●●●●●" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="acceptTerms" required>
                    <label for="acceptTerms">J'accepte les conditions générales</label>
                </div>
                <button type="submit" class="btn-auth">S'inscrire</button>
            </form>
            <div class="auth-separator">
                <span>Ou s'inscrire avec</span>
            </div>
            <div class="social-login">
                <div class="social-btn">G</div>
                <div class="social-btn">f</div>
                <div class="social-btn">•</div>
            </div>
            <div id="registerMessage" class="message"></div>
        </div>
    </div>
</div>

    
<script>
    // Gestion des onglets
    const tabBtns = document.querySelectorAll('.tab-btn');
    const forms = document.querySelectorAll('.auth-form');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.getAttribute('data-tab');
            
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            forms.forEach(form => form.classList.remove('active'));
            
            if(tabId === 'login') {
                document.getElementById('login-form').classList.add('active');
            } else {
                document.getElementById('register-form').classList.add('active');
            }
        });
    });

    // Connexion
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        if(!email || !password) {
            showMessage(loginMessage, 'Veuillez remplir tous les champs', 'error');
            return;
        }

        const users = JSON.parse(localStorage.getItem('bys_users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);

        if(user) {
            showMessage(loginMessage, 'Connexion réussie !', 'success');
            if(document.getElementById('rememberMe').checked) {
                localStorage.setItem('bys_current_user', JSON.stringify({email: user.email, name: user.name}));
            }
            setTimeout(() => {
                // Redirection ou action
                alert('Bienvenue ' + user.name);
            }, 1000);
        } else {
            showMessage(loginMessage, 'Email ou mot de passe incorrect', 'error');
        }
    });

    // Inscription
    const registerForm = document.getElementById('registerForm');
    const registerMessage = document.getElementById('registerMessage');

    registerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        const acceptTerms = document.getElementById('acceptTerms').checked;

        if(!name || !email || !password || !confirmPassword) {
            showMessage(registerMessage, 'Veuillez remplir tous les champs', 'error');
            return;
        }

        if(password.length < 6) {
            showMessage(registerMessage, '6 caractères minimum', 'error');
            return;
        }

        if(password !== confirmPassword) {
            showMessage(registerMessage, 'Les mots de passe ne correspondent pas', 'error');
            return;
        }

        if(!acceptTerms) {
            showMessage(registerMessage, 'Acceptez les conditions', 'error');
            return;
        }

        let users = JSON.parse(localStorage.getItem('bys_users') || '[]');
        if(users.some(u => u.email === email)) {
            showMessage(registerMessage, 'Email déjà utilisé', 'error');
            return;
        }

        users.push({ name, email, password });
        localStorage.setItem('bys_users', JSON.stringify(users));

        showMessage(registerMessage, 'Inscription réussie !', 'success');
        
        setTimeout(() => {
            document.querySelector('[data-tab="login"]').click();
            registerForm.reset();
        }, 1500);
    });

    function showMessage(element, text, type) {
        element.textContent = text;
        element.className = `message ${type}`;
        element.style.display = 'block';
        setTimeout(() => {
            element.style.display = 'none';
        }, 4000);
    }

    // Boutons sociaux
    document.querySelectorAll('.social-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('Connexion sociale bientôt disponible');
        });
    });
</script>id fa-cart-shopping"></i>
