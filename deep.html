<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Inscription | BYS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="deppcss.css">
</head>
<body>

<header>
        <nav class="menu">
            <img src="C:\Users\YOUVA\Documents\projet dev-web\images\menu.png" class="menu-icon">
            <h1><a href="file:///C:/Users/YOUVA/Documents/projet%20dev-web/index.html">B Y S</a></h1>
            <ul>
                <li><a href="#">Accueil </a></li>
                <li><a href="#"> Produits </a></li>
                <li><a href="#"> À propos </a></li>
                <li><a href="#"> Contact </a></li>
                <li><a href="#"> Panier </a></li>
            </ul>
        </nav>

        <img src="images\logo.png" class="logo">
    <div class="header-end">
        <i class="fa-solid fa-location-dot"></i>
        <i class="fa-solid fa-cart-shopping"></i>  
    </div>
    </header>

<div class="main-container">
    <div class="auth-card">
        <!-- Colonne gauche : Connexion rapide -->
        <div class="quick-col">
            <h3>INSCRIPTION RAPIDE</h3>
            <p>Créez votre compte en 2 clics</p>
            <div class="social-buttons">
                <div class="social-btn" data-social="google"><i class="fab fa-google"></i> Google</div>
                <div class="social-btn" data-social="apple"><i class="fab fa-apple"></i> Apple</div>
            </div>
        </div>

        <!-- Colonne droite : Formulaire inscription + onglets -->
        <div class="form-col">
            <div class="tabs">
                <button class="tab" data-tab="login"><p> </p>  Connexion</button>
                <button class="tab active" data-tab="register"><p> </p>  Inscription</button>
            </div>

            <!-- Panneau Connexion (caché par défaut) -->
            <div class="form-pane" id="loginPane">
                <form id="loginForm">
                    <div class="input-group">
                        <label>Adresse email</label>
                        <input type="email" id="loginEmail" placeholder="exemple@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>Mot de passe</label>
                        <input type="password" id="loginPassword" placeholder="**********" required>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" id="rememberCheck"> <label>Se souvenir de moi</label>
                    </div>
                    <button type="submit" class="btn-login">Se connecter</button>
                </form>
                <div class="footer-link">
                    Pas encore de compte ? <a href="#" id="switchToRegister">S'inscrire</a>
                </div>
                <div id="loginMessage" class="message"></div>
            </div>

            <!-- Panneau Inscription (actif) -->
            <div class="form-pane active" id="registerPane">
                <form id="registerForm">
                    <div class="input-group">
                        <label>Nom complet</label>
                        <input type="text" id="regName" placeholder="Hamid BENJELOUL" required>
                    </div>
                    <div class="input-group">
                        <label>Adresse email</label>
                        <input type="email" id="regEmail" placeholder="exemple@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>Mot de passe</label>
                        <input type="password" id="regPassword" placeholder="Min. 8 caractères" required>
                    </div>
                    <div class="input-group">
                        <label>Confirmer le mot de passe</label>
                        <input type="password" id="regConfirm" placeholder="Répétez" required>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" id="termsCheck"> <label>J'accepte les conditions d'utilisation</label>
                    </div>
                    <button type="submit" class="btn-login">Créer un compte</button>
                </form>
                <div class="footer-link">
                    Déjà un compte ? <a href="#" id="switchToLogin">Se connecter</a>
                </div>
                <div id="registerMessage" class="message"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Gestion des onglets
    const tabs = document.querySelectorAll('.tab');
    const panes = document.querySelectorAll('.form-pane');

    function switchTab(tabId) {
        panes.forEach(pane => pane.classList.remove('active'));
        document.getElementById(tabId + 'Pane').classList.add('active');
        tabs.forEach(tab => {
            if(tab.getAttribute('data-tab') === tabId) tab.classList.add('active');
            else tab.classList.remove('active');
        });
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.getAttribute('data-tab'));
        });
    });

    document.getElementById('switchToRegister')?.addEventListener('click', (e) => {
        e.preventDefault();
        switchTab('register');
    });
    document.getElementById('switchToLogin')?.addEventListener('click', (e) => {
        e.preventDefault();
        switchTab('login');
    });

    function showMessage(element, text, isError = true) {
        element.textContent = text;
        element.style.display = 'block';
        element.className = 'message ' + (isError ? 'error' : 'success');
        setTimeout(() => {
            element.style.display = 'none';
        }, 3500);
    }

    // Inscription
    const registerForm = document.getElementById('registerForm');
    const regMsg = document.getElementById('registerMessage');

    registerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const terms = document.getElementById('termsCheck').checked;

        if (!name || !email || !pwd || !confirm) {
            showMessage(regMsg, 'Tous les champs sont requis', true);
            return;
        }
        if (pwd.length < 8) {
            showMessage(regMsg, 'Le mot de passe doit contenir au moins 8 caractères', true);
            return;
        }
        if (pwd !== confirm) {
            showMessage(regMsg, 'Les mots de passe ne correspondent pas', true);
            return;
        }
        if (!terms) {
            showMessage(regMsg, 'Vous devez accepter les conditions', true);
            return;
        }
        let users = JSON.parse(localStorage.getItem('bys_users') || '[]');
        if (users.some(u => u.email === email)) {
            showMessage(regMsg, 'Cet email est déjà utilisé', true);
            return;
        }
        users.push({ name, email, password: pwd });
        localStorage.setItem('bys_users', JSON.stringify(users));
        showMessage(regMsg, 'Inscription réussie ! Connectez-vous.', false);
        setTimeout(() => switchTab('login'), 1500);
        registerForm.reset();
    });

    // Connexion
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        if (!email || !pwd) {
            showMessage(loginMsg, 'Email et mot de passe requis', true);
            return;
        }
        const users = JSON.parse(localStorage.getItem('bys_users') || '[]');
        const user = users.find(u => u.email === email && u.password === pwd);
        if (user) {
            showMessage(loginMsg, `Bienvenue ${user.name} !`, false);
            if (document.getElementById('rememberCheck').checked) {
                localStorage.setItem('bys_session', JSON.stringify(user));
            }
            setTimeout(() => alert('Connexion réussie'), 800);
        } else {
            showMessage(loginMsg, 'Email ou mot de passe incorrect', true);
        }
    });

    // Boutons sociaux
    document.querySelectorAll('.social-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('Connexion via réseau social (demo)');
        });
    });
    function switchTab(tabId) {
    panes.forEach(pane => pane.classList.remove('active'));
    document.getElementById(tabId + 'Pane').classList.add('active');
    tabs.forEach(tab => {
        if(tab.getAttribute('data-tab') === tabId) tab.classList.add('active');
        else tab.classList.remove('active');
    });
}
// Choisir l'onglet selon l'URL
if (window.location.hash === "#login") {
    switchTab("login");
} else if (window.location.hash === "#register") {
    switchTab("register");
}
</script>
</body>
</html>
