<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail produit</title>
  <link rel="icon" type="image/x-icon" href="images\logo.png">
  <style>
    .product-images img {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 12px;
    background: #f0f0f0;
}
.thumbnails img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}
#images-produit {
    min-height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
}
    .body {
      padding: 20px;
    }
    /* Réutilisez les styles de base + spécifiques produit */
    body { font-family: Arial; background: #f0f0f0; padding: 20px; }
    .product-container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    .product-images { flex: 1; position: relative; }
    .product-images img { width: 100%; border-radius: 10px; }
    .product-details { flex: 1; }
    .thumbnails { display: flex; gap: 10px; margin-top: 10px; }
    .thumbnails img { width: 80px; cursor: pointer; border-radius: 5px; }
    button { background: gray; border: none; border-radius: 20px; padding: 10px 20px; font-weight: bold; color: blue; cursor: pointer; margin-top: 20px; }
    .panier { margin-top: 40px; background: white; border-radius: 20px; padding: 20px; max-width: 800px; margin: 40px auto; }
    #precedent, #suivant { background: rgba(0,0,0,0.5); color: white; border: none; font-size: 24px; padding: 5px 12px; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); cursor: pointer; }
    #precedent { left: 10px; }
    #suivant { right: 10px; }
     #liste-similaires{
      margin-top: 40px;
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  align-items: center;
  margin-bottom: 40px;
    }
  </style>
</head>
<body>
  

    <div class="new-card">
      <div class="product-container">
        <!-- Images à gauche -->
        <div class="product-images">
          <button id="precedent">❮</button>
          <div id="images-produit"></div>
          <button id="suivant">❯</button>
        </div>

        <!-- Infos à droite -->
        <div class="product-details">
          <h1 id="titre-produit"></h1>
          <p id="prix-produit"></p>
          <ul id="specs-produit"></ul>
          <button onclick="ajouterProduitAuPanier()">
            Ajouter au panier
          </button>
        </div>
      </div>
    </div>
     <!-- COLONNE GAUCHE (réactions + avis) -->
      <div class="social-panel">
      <div class="buttons-row">
    <button>👍 J'aime</button>
    <button>🔗 Partager</button>  
      <h3>Avis</h3>
      <textarea placeholder="Ajouter un avis"></textarea>
      <button>Envoyer</button>
    </div>
  </div>

  <div class="produits-similaires">
    <h2>Produits similaires</h2>
    <div id="liste-similaires"></div>
  </div>

  <div class="panier">
    <h2>🛒 Votre Panier</h2>
    <ul id="liste-panier">
      <li style="text-align: center; color: #999;">Votre panier est vide</li>
    </ul>
    <div class="total">
      Total: <span id="total-panier">0.00</span> €
    </div>
    <div class="panier-buttons">
      <button class="vider-panier" onclick="viderPanier()">Vider le panier</button>
    </div>
  </div>
<script src="produit.js"></script>
<script src="product.js"></script>
<script src="panier-commun.js"></script>  <script>
    
                 // PRODUITS SIMILAIRES
      const similairesDiv = document.getElementById("liste-similaires");
      
      // Appliquer le style grid pour 3 par ligne
      similairesDiv.style.display = "grid";
      similairesDiv.style.gridTemplateColumns = "repeat(3, 1fr)";
      similairesDiv.style.gap = "20px";
      similairesDiv.style.maxWidth = "1400px";
      similairesDiv.style.margin = "0 auto";
      
      if (produit.similaires && produit.similaires.length > 0) {
        produit.similaires.forEach(idSimilaire => {
          const p = produits[idSimilaire];
          if (!p) return;

          // Création d'une carte avec le même style que clavier.html
          const card = document.createElement("div");
          card.className = "pc-card";
          
          // Style inline pour correspondre exactement à clavier.html
          card.style.background = "rgba(255, 255, 255, 0.95)";
          card.style.border = "2px solid black";
          card.style.borderRadius = "20px";
          card.style.padding = "15px";
          card.style.transition = "transform 0.3s, box-shadow 0.3s";
          card.style.cursor = "pointer";
          card.style.display = "flex";
          card.style.flexDirection = "column";
          
          // Ajout de l'effet hover
          card.onmouseenter = () => {
            card.style.transform = "translateY(-5px)";
            card.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
          };
          card.onmouseleave = () => {
            card.style.transform = "translateY(0)";
            card.style.boxShadow = "none";
          };

          card.innerHTML = `
            <img src="${p.images[0]}" alt="${p.nom}" style="width: 100%; height: 200px; object-fit: contain; background: #f0f0f0; border-radius: 10px; margin-bottom: 10px;">
            <h3 style="font-size: 1rem; margin: 10px 0; text-align: center; color: #333;">${p.nom}</h3>
            <ul style="list-style: none; padding: 0; margin: 0 0 10px 0;">
              ${p.caracteristiques.split(" | ").slice(0, 2).map(spec => `<li style="font-size: 0.8rem; margin: 5px 0; color: #555;">⚡ ${spec}</li>`).join('')}
            </ul>
            <p class="price" style="font-weight: bold; color: #d32f2f; font-size: 1.2rem; text-align: center; margin: 10px 0;">${p.prix} €</p>
            <button style="background: gray; border: 1px solid black; border-radius: 20px; padding: 8px 16px; font-weight: bold; color: blue; cursor: pointer; margin-top: 10px; transition: 0.2s; width: fit-content; align-self: center;">Ajouter au panier</button>
          `;

          // Ajout de l'événement click pour rediriger vers le produit
          card.addEventListener('click', (e) => {
            if (!e.target.closest('button')) {
              window.location.href = "produit.html?id=" + p.id;
            }
          });
          
          // Ajout de l'événement pour le bouton "Ajouter au panier"
          const btn = card.querySelector('button');
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (typeof ajouterAuPanier === 'function') {
              ajouterAuPanier(p.nom, p.prix, p.images[0]);
            } else if (typeof window.ajouterAuPanier === 'function') {
              window.ajouterAuPanier(p.nom, p.prix, p.images[0]);
            }
          });

          similairesDiv.appendChild(card);
        });
      }

document.querySelectorAll('.add-to-cart-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        const produit = btn.closest('.pc');

        ajouterAuPanier(
            produit.dataset.name,
            parseFloat(produit.dataset.price),
            produit.dataset.img
        );

    });

});
</script>
<script>
function ajouterProduitAuPanier() {

    const nom = document.getElementById('titre-produit').textContent;

    const prixText =
        document.getElementById('prix-produit').textContent;

    const prix = parseFloat(
        prixText.replace('€', '').replace(',', '.')
    );

    const image =
        document.querySelector('#images-produit img')?.src || '';

    ajouterAuPanier(nom, prix, image);
}
</script>
</body>
</html>
