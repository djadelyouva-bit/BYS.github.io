<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail produit</title>
  <link rel="icon" type="image/x-icon" href="images\logo.png">
  <style>
    .product-images img {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 12px;
    background: #f0f0f0;
}
.thumbnails img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}
#images-produit {
    min-height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
}
    .body {
      padding: 20px;
    }
    /* Réutilisez les styles de base + spécifiques produit */
    body { font-family: Arial; background: #f0f0f0; padding: 20px; }
    .product-container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    .product-images { flex: 1; position: relative; }
    .product-images img { width: 100%; border-radius: 10px; }
    .product-details { flex: 1; }
    .thumbnails { display: flex; gap: 10px; margin-top: 10px; }
    .thumbnails img { width: 80px; cursor: pointer; border-radius: 5px; }
    button { background: gray; border: none; border-radius: 20px; padding: 10px 20px; font-weight: bold; color: blue; cursor: pointer; margin-top: 20px; }
    .panier { margin-top: 40px; background: white; border-radius: 20px; padding: 20px; max-width: 800px; margin: 40px auto; }
    #precedent, #suivant { background: rgba(0,0,0,0.5); color: white; border: none; font-size: 24px; padding: 5px 12px; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); cursor: pointer; }
    #precedent { left: 10px; }
    #suivant { right: 10px; }
     #liste-similaires{
      margin-top: 40px;
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  align-items: center;
  margin-bottom: 40px;
    }
  </style>
</head>
<body>
  

    <div class="new-card">
      <div class="product-container">
        <!-- Images à gauche -->
        <div class="product-images">
          <button id="precedent">❮</button>
          <div id="images-produit"></div>
          <button id="suivant">❯</button>
        </div>

        <!-- Infos à droite -->
        <div class="product-details">
          <h1 id="titre-produit"></h1>
          <p id="prix-produit"></p>
          <ul id="specs-produit"></ul>
          <button onclick="ajouterProduitAuPanier()">
            Ajouter au panier
          </button>
        </div>
      </div>
    </div>
     <!-- COLONNE GAUCHE (réactions + avis) -->
      <div class="social-panel">
      <div class="buttons-row">
    <button>👍 J'aime</button>
    <button>🔗 Partager</button>  
      <h3>Avis</h3>
      <textarea placeholder="Ajouter un avis"></textarea>
      <button>Envoyer</button>
    </div>
  </div>

  <div class="produits-similaires">
    <h2>Produits similaires</h2>
    <div id="liste-similaires"></div>
  </div>

  <div class="panier">
    <h2>🛒 Votre Panier</h2>
    <ul id="liste-panier">
      <li style="text-align: center; color: #999;">Votre panier est vide</li>
    </ul>
    <div class="total">
      Total: <span id="total-panier">0.00</span> €
    </div>
    <div class="panier-buttons">
      <button class="vider-panier" onclick="viderPanier()">Vider le panier</button>
    </div>
  </div>
<script src="produit.js"></script>
<script src="product.js"></script>
<script src="panier-commun.js"></script>  <script>
    let panier = [];

    function ajouterAuPanier(nom, prix) {
      panier.push({ nom: nom, prix: parseFloat(prix) });
      afficherPanier();
    }

    function ajouterProduitAuPanier() {
      const nom = document.getElementById('titre-produit').textContent;
      const prixText = document.getElementById('prix-produit').textContent;
      const prix = parseFloat(prixText.replace('€', '').trim());
      ajouterAuPanier(nom, prix);
    }

    function afficherPanier() {
      const listePanier = document.getElementById('liste-panier');
      const totalSpan = document.getElementById('total-panier');
      
      listePanier.innerHTML = '';
      let total = 0;
      
      if (panier.length === 0) {
        listePanier.innerHTML = '<li style="text-align: center; color: #999;">Votre panier est vide</li>';
      } else {
        panier.forEach((item, index) => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${item.nom}</span>
            <span>${item.prix.toFixed(2)} €</span>
            <button onclick="retirerDuPanier(${index})" style="background-color:#f44336; padding:5px 10px;">Retirer</button>
          `;
          listePanier.appendChild(li);
          total += item.prix;
        });
      }
      
      totalSpan.textContent = total.toFixed(2);
    }

    function retirerDuPanier(index) {
      panier.splice(index, 1);
      afficherPanier();
    }

    function viderPanier() {
      panier = [];
      afficherPanier();
    }


  </script>
</body>
</html>
